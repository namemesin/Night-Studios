<!doctype html>
<!-- Built from the Hub/src folder by build.py. Edit the files there, not this one. -->
<html lang="en" data-game="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1020">
<meta name="description" content="Night Studios: arcade games after dark. Snowboarding, drifting, heists, trading and more, with one login for every game.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Night Studios">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Night Studios">
<meta property="og:title" content="Night Studios">
<meta property="og:description" content="Arcade games after dark: snowboarding, drifting, heists, trading and more. One login for every game.">
<meta property="og:image" content="og-image.png">
<meta name="twitter:card" content="summary_large_image">
<title>Night Studios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Mono:wght@400;500&display=swap">
<style>
{{styles}}
</style>
<style>
body{background:radial-gradient(900px 500px at 80% -10%,rgba(92,242,176,.16),transparent 60%),radial-gradient(800px 500px at 0 0,rgba(180,140,255,.16),transparent 60%),var(--bg);background-attachment:fixed}
.app{height:auto;min-height:100%}
.studio{font:34px/1 var(--display);letter-spacing:1px;margin:10px 0 0}
a.game{text-decoration:none;color:inherit}
a.game:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
.game.watch{background:linear-gradient(135deg,#3a2110,#170e08);border-color:#8a5a2a}
.game.watch::after{background:radial-gradient(circle at 85% 0,rgba(255,179,71,.3),transparent 55%),radial-gradient(circle at 55% 10%,rgba(255,107,61,.18),transparent 50%)}
.game.watch .tag{color:#ffb347}
.game.drive{background:linear-gradient(135deg,#2a1247,#120a26);border-color:#6a2f9c}
.game.drive::after{background:radial-gradient(circle at 85% 0,rgba(61,245,255,.22),transparent 55%),radial-gradient(circle at 55% 10%,rgba(255,61,203,.2),transparent 50%)}
.game.drive .tag{color:#3df5ff}
.game.keep{background:linear-gradient(135deg,#2a1f4a,#120f1c);border-color:#6a55a8}
.game.keep::after{background:radial-gradient(circle at 85% 0,rgba(180,140,255,.28),transparent 55%),radial-gradient(circle at 55% 10%,rgba(111,211,255,.16),transparent 50%)}
.game.keep .tag{color:#b48cff}
.game.heist{background:linear-gradient(135deg,#10303a,#0a1418);border-color:#2f6b7a}
.game.heist::after{background:radial-gradient(circle at 85% 0,rgba(92,242,176,.22),transparent 55%),radial-gradient(circle at 55% 10%,rgba(74,163,255,.18),transparent 50%)}
.game.heist .tag{color:#5cf2b0}
.game.market{background:linear-gradient(135deg,#3a1420,#160a14);border-color:#8a3a4a}
.game.market::after{background:radial-gradient(circle at 85% 0,rgba(255,138,92,.3),transparent 55%),radial-gradient(circle at 55% 10%,rgba(255,210,74,.16),transparent 50%)}
.game.market .tag{color:#ff8a5c}
.game.rally{background:linear-gradient(135deg,#1c3016,#0a120c);border-color:#4f7a2a}
.game.rally::after{background:radial-gradient(circle at 85% 0,rgba(198,255,74,.24),transparent 55%),radial-gradient(circle at 55% 10%,rgba(127,232,255,.14),transparent 50%)}
.game.rally .tag{color:#c6ff4a}
.game .meta{color:var(--snow);opacity:.8}
.lay{max-width:520px;width:100%;margin:0 auto}.lay .setrow{padding:0}
/* desktop: a wide grid of games */
html.deskhub .app{max-width:1180px}
html.deskhub .panel{max-width:none;gap:16px;padding:24px 24px 48px}
html.deskhub .studio{font-size:54px}
html.deskhub .games{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
html.deskhub .game{padding:22px;align-content:start}
html.deskhub .game h3{font-size:26px}.deskhub .game p{font-size:13px}
html.deskhub #authForm,html.deskhub .panel>.box,html.deskhub .panel>.go{max-width:520px;width:100%;margin:0 auto}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand"><span class="moon"></span><b>Night Studios</b></span>
    <div class="wallet"><span class="chip" id="whoChip">Guest</span></div>
  </header>
  <main><div class="panel" id="panel"></div></main>
</div>
<script src="studio.js"></script>
<script>
(() => {
  'use strict';
{{game}}
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
