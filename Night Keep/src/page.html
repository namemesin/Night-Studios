<!doctype html>
<!-- Built from the src folder by build.py. Edit the files in src, not this one. -->
<html lang="en" data-game="keep">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<meta name="theme-color" content="#120f1c">
<meta name="description" content="Hold the keep against the night. Build towers beside the road, send your knight into the fight and call down meteors.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Night Keep">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Night Studios">
<meta property="og:title" content="Night Keep">
<meta property="og:description" content="Hold the keep against the night. Build towers beside the road, send your knight into the fight and call down meteors.">
<title>Night Keep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Mono:wght@400;500&display=swap">
<style>
{{styles}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top">
    <button class="brand" id="brandBtn" type="button" aria-label="Night Keep home"><span class="moon"></span><b>Night Keep</b></button>
    <div class="wallet">
      <span class="chip lvl" id="lvlChip" title="Level">Lv 1</span>
      <span class="chip flk" id="flkChip" title="Coins">0</span>
      <button class="icon" id="setBtn" type="button" aria-label="Settings">⚙</button>
    </div>
  </header>
  <main class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="keep" id="keep" hidden>
      <div class="kbar">
        <span class="kstat gold">Gold <b id="gold">0</b></span>
        <span class="kstat lives">Lives <b id="lives">0</b></span>
        <span class="kstat">Wave <b id="wave">0</b></span>
        <span class="kstat">Foes <b id="foes">0</b></span>
        <span class="kstat pts">Score <b id="score">0</b></span>
        <span class="sp"></span>
        <button id="btnBank" class="kgo" type="button" hidden title="The map is won. End the siege here and bank your score.">Bank score</button>
        <button id="btnWave" class="kgo" type="button" title="Start the next wave. During a wave this becomes Rush: call the next wave early for bonus gold.">Start wave</button>
        <button id="btnAuto" type="button">Auto: off</button>
        <button id="btnSpeed" type="button" title="Game speed">1x</button>
        <button id="btnPause" type="button">Pause</button>
      </div>
      <div id="kstage">
        <canvas id="game" width="320" height="192"></canvas>
        <div id="labels"></div>
        <div id="bossbar"><i id="bossfill"></i></div>
        <div id="toast"></div>
        <div id="achChip"></div>
        <div id="pop"></div>
      </div>
      <div class="kbar" id="towerBar"></div>
      <div class="kbar" id="info"></div>
    </div>
    <button class="pause" id="pauseBtn" type="button" aria-label="Pause" hidden>II</button>
    <div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
  </main>
</div>
<script src="../studio.js"></script>
<script>
(() => {
  'use strict';
{{game}}
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
</script>
</body>
</html>
