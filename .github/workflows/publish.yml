name: Publish Night Studios

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to post each published version as a release
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # each app's version number comes from the tags and history
      - name: Build the site and set each version
        run: |
          # The home page and every game have their own version. build.py explains how the numbers work:
          # the VERSION file in each app's folder, plus a count of publishes that changed that app.
          python3 build.py --release
          test -f site/index.html && test -f site/studio.js
          for page in $(find site -name index.html); do
            ! grep -q "APP_VERSION = 'dev'" "$page"
          done
          ! grep -q "night-studios-dev" site/sw.js
          cat site/versions.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Post the releases
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # One release for each app whose version is new, tagged like run-v1.0.2.
          # The tag is how the next publish knows which number comes next.
          while IFS=$'\t' read -r tag title path; do
            [ -n "$tag" ] || continue
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$title is already posted"
            else
              gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes "Play it: ${PAGE_URL}${path}" --generate-notes
            fi
          done < .release
