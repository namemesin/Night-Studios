name: Publish Night Games

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to post each published version as a release
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version number comes from the tags and history
      - name: Build the game
        run: |
          python3 build.py
          cp -R night-run-app site
          test -f site/index.html
      - name: Set the version number
        id: version
        run: |
          # The first number is in VERSION_MAJOR. The second goes up once per push that changes the game.
          # Each published version is posted as a release tagged like v3.1, which is how the next publish knows where to continue.
          major="$(tr -d '[:space:]' < VERSION_MAJOR)"
          latest="$(git tag --list "v$major.*" --sort=-v:refname | head -n 1)"
          if [ -z "$latest" ]; then
            version="$major.0"; new=true
          elif git diff --quiet "$latest" HEAD -- src night-run-app; then
            version="${latest#v}"; new=false
          else
            version="$major.$(( ${latest##*.} + 1 ))"; new=true
          fi
          sed -i -E "s/(APP_VERSION = ')[^']*'/\1$version'/" site/index.html
          sed -i -E "s/(const CACHE = 'night-run-)[^']*'/\1$version'/" site/sw.js
          printf '{"version": "%s"}\n' "$version" > site/version.json
          grep -q "APP_VERSION = '$version'" site/index.html
          grep -q "const CACHE = 'night-run-$version'" site/sw.js
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Post the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every published version gets a GitHub release. The release carries the version's tag,
          # which is how the next publish knows which number comes next.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION is already posted"
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Night Games $VERSION" --notes "Play it: $PAGE_URL" --generate-notes
          fi
